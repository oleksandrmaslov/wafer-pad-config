# Wafer Pad v0.1 — application configuration (nice!nano v2, Zephyr v4.5.0)

# ---- Console, logging and shell over USB CDC ACM ---------------------------
# The board's Kconfig.defconfig enables the CDC ACM serial backend.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_SHELL=y
CONFIG_I2C_SHELL=y

# ---- Peripherals -----------------------------------------------------------
CONFIG_GPIO=y
CONFIG_I2C=y
# Every TWIM stall blocks the SHARED bus (touch + IMU) for this long. Set
# explicitly: an upstream shield Kconfig raises the default to 1000 ms
# whenever SENSOR=y. Must stay above the longest legitimate IQS5xx clock
# stretch (one LP2 report period, ~160-200 ms).
CONFIG_I2C_TRANSFER_TIMEOUT_MS=500
CONFIG_SENSOR=y
CONFIG_ADC=y

# ---- Bluetooth LE HID mouse (HID over GATT) ---------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_DIS=y
CONFIG_BT_BAS=y
CONFIG_BT_DEVICE_NAME="Wafer Pad"
# 962 = 0x03C2, GAP appearance "HID Mouse"
CONFIG_BT_DEVICE_APPEARANCE=962
CONFIG_BT_DIS_MANUF_NAME_STR="Wafer Pad contributors"
CONFIG_BT_DIS_MODEL_NUMBER_STR="Wafer Pad v0.1"

# Up to 4 bonded hosts; the least recently USED bond is dropped when a 5th
# host pairs (the usage order is persisted, so it survives reboots).
# New pairings (Just Works, NoInputNoOutput) are accepted only inside a
# pairing window: while no bond exists, CONFIG_WAFER_PAD_BLE_PAIRING_WINDOW_S
# after boot, or after "wp pair" on the shell. A host that "forgot" the pad
# can re-pair (without unpairing here) only while the window is open.
# Pairing requires LE Secure Connections (Bluetooth 4.2+ host): legacy-only
# hosts are rejected (Zephyr default CONFIG_BT_SMP_SC_PAIR_ONLY=y).
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_KEYS_SAVE_AGING_COUNTER_ON_PAIRING=y
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y

# HID reports in flight (2) + one ATT response + Service Changed + BAS: the
# router's notify must never wait for an ATT buffer (K_FOREVER).
CONFIG_BT_ATT_TX_COUNT=5
# Report rejected connection-parameter requests (re-requested with back-off).
CONFIG_BT_USER_CONN_PARAM_REJECTED=y

# GAP Peripheral Preferred Connection Parameters (1.25 ms / 10 ms units):
# 15 ms interval, latency 0, 6 s supervision timeout (Apple-compliant).
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# Bonds persist in the storage partition (0xEC000) through settings + NVS.
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
