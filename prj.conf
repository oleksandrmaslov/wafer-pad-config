# Wafer Pad v0.1 — application configuration (nice!nano v2, Zephyr v4.5.0)

# ---- Console, logging and shell over USB CDC ACM ---------------------------
# The board's Kconfig.defconfig enables the CDC ACM serial backend.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_SHELL=y
CONFIG_I2C_SHELL=y

# ---- Peripherals -----------------------------------------------------------
CONFIG_GPIO=y
CONFIG_I2C=y
# Every TWIM stall blocks the SHARED bus (touch + IMU) for this long. Set
# explicitly: an upstream shield Kconfig raises the default to 1000 ms
# whenever SENSOR=y. Must stay above the longest legitimate IQS5xx clock
# stretch (one LP2 report period, ~160-200 ms).
CONFIG_I2C_TRANSFER_TIMEOUT_MS=500
CONFIG_SENSOR=y
